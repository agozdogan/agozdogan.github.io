<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="400" viewBox="0 0 1200 400">
  <defs>
    <style>
      .bg { fill: #0f1724; }
      .title { fill: #ffffff; font-family: 'Segoe UI', Roboto, Arial; font-size: 36px; font-weight: 700; }
      .subtitle { fill: #cbd5e1; font-family: 'Segoe UI', Roboto, Arial; font-size: 18px; }
      .box { fill: #1f2937; stroke: #374151; stroke-width:2; rx:8; }
      .label { fill: #e6eef8; font-family: 'Segoe UI', Roboto, Arial; font-size:16px; }
      .arrow { stroke: #60a5fa; stroke-width:4; fill:none; marker-end: url(#arrowhead); }
    </style>
    <marker id="arrowhead" markerWidth="10" markerHeight="7" refX="10" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#60a5fa" />
    </marker>
  </defs>

  <rect class="bg" width="100%" height="100%" rx="0" />

  <text x="48" y="72" class="title">Modern Yapay Zekânın Temel Fikri</text>
  <text x="48" y="100" class="subtitle">Veriden temsiller öğrenmek — ölçek, mimari ve etik</text>

  <!-- Boxes -->
  <rect x="80" y="160" width="220" height="90" class="box" />
  <text x="190" y="210" text-anchor="middle" class="label">Ham Veri</text>

  <rect x="440" y="145" width="280" height="120" class="box" />
  <text x="580" y="210" text-anchor="middle" class="label">Model / Temsiller</text>

  <rect x="820" y="160" width="220" height="90" class="box" />
  <text x="930" y="210" text-anchor="middle" class="label">Görevler</text>

  <!-- Arrows -->
  <path d="M300 205 L440 205" class="arrow" />
  <path d="M720 205 L820 205" class="arrow" />

  <!-- Notes -->
  <text x="240" y="270" class="subtitle">Optimizasyon + Ölçek → Zengin temsiller</text>

  <g transform="translate(560,270)">
    <rect x="-150" y="0" width="300" height="40" rx="6" class="box" />
    <text x="0" y="28" text-anchor="middle" class="label">Transfer & İnce Ayar ile Genelleme</text>
  </g>

</svg>
